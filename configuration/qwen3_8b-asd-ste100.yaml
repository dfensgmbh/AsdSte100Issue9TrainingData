# To run this recipe:
#   automodel examples/llm_finetune/qwen/qwen3_8b_squad_spark.yaml --nproc-per-node 8
# Adjust --nproc-per-node to the number of GPUs available on your machine.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 32          # was 64 — smaller EBS for small dataset
  local_batch_size: 1
  ckpt_every_steps: 200
  val_every_steps: 50            # was 10 — less val overhead
  num_epochs: 3                  # was 10 — overfits long before that

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-8B

compile:
  enabled: true                  # enable for speed on fixed shapes (packed seq)
  mode: "default"
  fullgraph: false
  dynamic: false
  backend: null

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.te_parallel_ce.TEParallelCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: appclusive/asd-ste100
  split: train

packed_sequence:
  packed_sequence_size: 1024

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true                  # was false — important for generalization!

# IMPORTANT: validate on the SAME distribution as training
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: appclusive/asd-ste100
  split: train                          # use a held-out slice
  limit_dataset_samples: 128

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW          # was Adam — AdamW for proper weight decay
  betas: [0.9, 0.95]                   # was [0.9, 0.999] — LLM standard
  eps: 1.0e-8
  lr: 6.0e-6                           # was 1.0e-5 — 5x lower
  weight_decay: 0.01                   # was 0 — regularization
  fused: true

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 6.0e-7                       # was 1.0e-6
  # warmup handled internally; if exposed:
  # warmup_steps: 20

# Add grad clipping (check exact key in your recipe; commonly):
# clip_grad: 1.0

# Optional: async checkpointing to avoid the ~3 min stalls
# checkpoint:
#   async_save: true
#   save_consolidated: false   # only at end of run

ci:
  recipe_owner: akoumpa

